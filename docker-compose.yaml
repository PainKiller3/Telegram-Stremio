services:
  telegram-stremio:
    build: .
    container_name: tg_stremio  
    ports:
      - "8000:8000"
    volumes:
      - ./config.env:/app/config.env
      - /media/telestream_media:/media/telestream_media
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "1m"     
        max-file: "3"

  # Jellyfin media server co-located alongside Telestream (accessible at http://<VPS_IP>:8096)
  # 100% Free & Open-Source alternative to Emby with unpaywalled Android/iOS/TV playback
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    network_mode: host
    environment:
      - JELLYFIN_PublishedServerUrl=http://localhost:8096
    volumes:
      - /var/lib/jellyfin/config:/config
      - /var/lib/jellyfin/cache:/cache
      - /media/telestream_media:/media/telestream_media:ro
    restart: unless-stopped
