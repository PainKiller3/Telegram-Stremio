<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Streaming Account — {{ brand_name }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --primary: #f59e0b;
            --primary-hover: #d97706;
            --text: #f8fafc;
            --text-sec: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .signup-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            max-width: 440px;
            width: 100%;
            padding: 2.25rem 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .header .icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 9999px;
            background: color-mix(in srgb, var(--primary) 15%, transparent);
            color: var(--primary);
            font-size: 1.6rem;
            margin-bottom: 1rem;
        }
        .header h1 { font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.35rem; }
        .header p { font-size: 0.88rem; color: var(--text-sec); }
        .form-group { margin-bottom: 1.25rem; }
        .s-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-sec);
            margin-bottom: 0.4rem;
        }
        .s-input {
            width: 100%;
            background: color-mix(in srgb, var(--bg) 80%, transparent);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .s-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 30%, transparent);
        }
        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 0.75rem;
            padding: 0.85rem;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s, transform 0.05s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        .btn-submit:hover { background: var(--primary-hover); }
        .btn-submit:active { transform: scale(0.99); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg-box {
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: none;
        }
        .msg-box.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; display: block; }
        .msg-box.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; display: block; }
        .success-card {
            text-align: center;
            padding: 1.5rem 0.5rem;
            animation: fadeIn 0.3s ease-in-out;
        }
        .success-card .check-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 4rem;
            height: 4rem;
            border-radius: 9999px;
            background: rgba(34,197,94,0.15);
            color: #4ade80;
            font-size: 2rem;
            margin-bottom: 1.25rem;
            border: 2px solid rgba(34,197,94,0.4);
        }
        .success-card h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 0.5rem;
        }
        .success-card p {
            font-size: 0.92rem;
            color: var(--text-sec);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .success-card .countdown-badge {
            display: inline-block;
            background: rgba(245,158,11,0.15);
            color: #f59e0b;
            font-weight: 700;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.96); }
            to { opacity: 1; transform: scale(1); }
        }
        .footer-links { text-align: center; margin-top: 1.5rem; font-size: 0.82rem; color: var(--text-sec); }
        .footer-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="signup-card">
    <div class="header">
        <div class="icon"><i class="fa-solid fa-play"></i></div>
        <h1>Create Account</h1>
        <p>Sign up to watch movies and series on Emby</p>
    </div>

    <div id="msg" class="msg-box"></div>

    <div id="success-view" class="success-card" style="display:none;">
        <div class="check-icon"><i class="fa-solid fa-check"></i></div>
        <h2>Welcome to Emby!</h2>
        <p>Your streaming account has been created successfully.</p>
        <div class="countdown-badge">
            <i class="fa-solid fa-clock"></i> Redirecting in <span id="redirect-timer">3</span>s...
        </div>
        <a id="direct-login-btn" href="#" class="btn-submit" style="text-decoration:none;">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Open Emby Player Now
        </a>
    </div>

    <form id="signup-form" onsubmit="handleSignup(event)">
        <div class="form-group">
            <label class="s-label" for="username">Username</label>
            <input type="text" id="username" class="s-input" required placeholder="Choose a username" autocomplete="username" autofocus>
        </div>

        <div class="form-group">
            <label class="s-label" for="password">Password</label>
            <input type="password" id="password" class="s-input" required placeholder="Choose a password" autocomplete="new-password">
        </div>

        <div class="form-group">
            <label class="s-label" for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" class="s-input" required placeholder="Re-type your password" autocomplete="new-password">
        </div>

        <button type="submit" id="submit-btn" class="btn-submit">
            <i class="fa-solid fa-user-plus"></i> Sign Up
        </button>
    </form>

    <div class="footer-links">
        Already have an account? <a href="{{ emby_external_url or 'http://' + request.url.hostname + ':8096' }}" target="_blank">Open Emby Player &rarr;</a>
    </div>
</div>

<script>
async function handleSignup(e) {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    const cp = document.getElementById('confirm_password').value;
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submit-btn');

    if (p !== cp) {
        msg.className = 'msg-box error';
        msg.textContent = 'Passwords do not match.';
        return;
    }

    if (p.length < 4) {
        msg.className = 'msg-box error';
        msg.textContent = 'Password must be at least 4 characters.';
        return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating account...';
    msg.style.display = 'none';

    try {
        const res = await fetch('/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        if (res.ok) {
            // Hide the signup form and footer link
            document.getElementById('signup-form').style.display = 'none';
            const footerEl = document.querySelector('.footer-links');
            if (footerEl) footerEl.style.display = 'none';

            // Show success screen
            const successView = document.getElementById('success-view');
            const directBtn = document.getElementById('direct-login-btn');
            const timerEl = document.getElementById('redirect-timer');
            const targetUrl = data.login_url || "{{ emby_external_url or 'http://' + request.url.hostname + ':8096' }}";

            directBtn.href = targetUrl;
            successView.style.display = 'block';

            // 3-second countdown redirect
            let countdown = 3;
            timerEl.textContent = countdown;
            const interval = setInterval(() => {
                countdown -= 1;
                if (countdown > 0) {
                    timerEl.textContent = countdown;
                } else {
                    clearInterval(interval);
                    window.location.href = targetUrl;
                }
            }, 1000);
        } else {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Sign Up';
            msg.className = 'msg-box error';
            msg.textContent = data.detail || 'Failed to create account.';
        }
    } catch (err) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Sign Up';
        msg.className = 'msg-box error';
        msg.textContent = 'Network error. Please try again.';
    }
}
</script>

</body>
</html>
